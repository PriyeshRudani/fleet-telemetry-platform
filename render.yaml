services:
  - type: web
    name: fleet-telemetry-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.scripts.seed_admin
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fleet-telemetry-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: fleet-telemetry-redis
          property: connectionString
      - key: MQTT_BROKER_HOST
        value: broker.emqx.io
      - key: MQTT_BROKER_PORT
        value: "1883"
      - key: MQTT_TOPIC_PREFIX
        value: fleet/telemetry
      - key: CORS_ALLOWED_ORIGINS
        value: https://fleet-telemetry-frontend.onrender.com
      - key: EMAIL_ENABLED
        value: "false"
      - key: ROUTE_DEVIATION_THRESHOLD_METERS
        value: "100"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: ROUTE_ALERT_RECIPIENT_EMAIL
        sync: false

  - type: web
    name: fleet-telemetry-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://fleet-telemetry-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: fleet-telemetry-redis
    plan: free
    ipAllowList: []

databases:
  - name: fleet-telemetry-postgres
    plan: free